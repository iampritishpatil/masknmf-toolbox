[project]
name = "masknmf-toolbox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.29.5",
    "torch>=2.6.0",
    "jupyter>=1.1.1",
    "future>=1.0.0",
    "numpy>=2.2.5",
    "scipy>=1.15.2",
    "plotly>=6.0.1",
    "h5py>=3.13.0",
    "matplotlib>=3.10.1",
    "networkx>=3.4.2",
    "scikit-image>=0.25.2",
    "oasis-deconv>=0.2.1",
    "tqdm>=4.67.1",
    "jupyter-rfb>=0.5.1",
    "imgui-bundle>=1.6.2",
    "napari>=0.6.0",
    "pyside6>=6.9.0",
    "qtpy>=2.4.3",
]



[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
torchvision = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
